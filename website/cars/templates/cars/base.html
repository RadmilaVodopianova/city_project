
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AutoWorld{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101318;
            color: white;
        }

        header {
            background: #1b2028;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #f5c451;
        }

        nav {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #f5c451;
        }

        .hero {
            text-align: center;
            padding: 90px 20px;
            background: linear-gradient(
                135deg,
                #202b3a,
                #3a3022
            );
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 19px;
            color: #d1d5db;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: #222936;
            padding: 35px 25px;
            border-radius: 16px;
            text-align: center;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
        }

        .card h2 {
            color: #f5c451;
        }

        .card p {
            color: #d1d5db;
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            background: #f5c451;
            color: #101318;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn:hover {
            background: #ffda78;
        }

        footer {
            background: #1b2028;
            text-align: center;
            padding: 25px;
            color: #9ca3af;
            margin-top: 60px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">AUTOWORLD</div>

    <nav>
        <a href="{% url 'cars_home' %}">Головна</a>
        <a href="{% url 'toyota' %}">Toyota</a>
        <a href="{% url 'honda' %}">Honda</a>
        <a href="{% url 'renault' %}">Renault</a>
    </nav>
</header>

{% block content %}
{% endblock %}

<footer>
    © 2026 AutoWorld | Автомобільний вебдодаток
</footer>

</body>
</html>
